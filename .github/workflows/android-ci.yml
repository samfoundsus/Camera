name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        timeout-minutes: 15
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Run Android Lint
        id: android_lint
        run: ./gradlew lintDebug

      - name: Print Android Lint Errors
        if: failure() && steps.android_lint.outcome == 'failure'
        run: |
          LINT_TEXT_REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$LINT_TEXT_REPORT" ]; then
            echo "=== Android Lint Report ($LINT_TEXT_REPORT) ==="
            cat "$LINT_TEXT_REPORT"
          elif [ -f "app/build/reports/lint-results-debug.txt" ]; then
            echo "=== Android Lint Report (app/build/reports/lint-results-debug.txt) ==="
            cat "app/build/reports/lint-results-debug.txt"
          else
            echo "Android Lint text report not found. Searching build directory..."
            find app/build -name "lint-results-debug*.txt" -exec sh -c 'echo "=== {} ==="; cat "{}"' \;
          fi

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          retention-days: 14

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
